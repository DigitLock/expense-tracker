  /currencies/convert:
    get:
      description: Convert an amount from one currency to another using current exchange
        rates. Supports conversion between RSD and EUR.
      parameters:
      - description: Amount to convert
        example: 100
        in: query
        name: amount
        required: true
        type: number
      - description: Source currency code
        enum:
        - RSD
        - EUR
        example: EUR
        in: query
        name: from
        required: true
        type: string
      - description: Target currency code
        enum:
        - RSD
        - EUR
        example: RSD
        in: query
        name: to
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Conversion result
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.ConvertCurrencyResponse'
              type: object
        "400":
          description: Invalid parameters (missing amount, invalid currency codes)
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized - invalid or missing JWT token
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Convert currency
      tags:
      - Currencies
  /currencies/rates:
    get:
      description: Retrieve current exchange rates for all supported currencies (RSD,
        EUR) with base currency RSD
      produces:
      - application/json
      responses:
        "200":
          description: Current exchange rates
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.ExchangeRatesResponse'
              type: object
        "401":
          description: Unauthorized - invalid or missing JWT token
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get exchange rates
      tags:
      - Currencies
  /health:
    get:
      description: Returns the overall health status of the service including database
        connectivity
      produces:
      - application/json
      responses:
        "200":
          description: Service is healthy
          schema:
            $ref: '#/definitions/dto.HealthResponse'
        "503":
          description: Service is degraded (database unhealthy)
          schema:
            $ref: '#/definitions/dto.HealthResponse'
      summary: Health check
      tags:
      - Health
  /ready:
    get:
      description: Kubernetes readiness probe endpoint. Returns 200 if service is
        ready to accept traffic, 503 otherwise.
      produces:
      - text/plain
      responses:
        "200":
          description: ready
          schema:
            type: string
        "503":
          description: not ready
          schema:
            type: string
      summary: Readiness check
      tags:
      - Health
  /reports/monthly-summary:
    get:
      description: Generate comprehensive monthly financial report including income,
        expenses, net savings, category breakdowns, and account balances
      parameters:
      - description: Month in YYYY-MM format (defaults to current month)
        example: 2025-11
        in: query
        name: month
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Monthly financial summary
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.MonthlySummaryResponse'
              type: object
        "400":
          description: Invalid query parameters
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized - invalid or missing JWT token
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Monthly financial summary
      tags:
      - Reports
  /reports/spending-by-category:
    get:
      description: Generate detailed spending analysis grouped by category for a specified
        date range with percentages and averages
      parameters:
      - description: Start date in YYYY-MM-DD format
        example: "2025-11-01"
        in: query
        name: start_date
        type: string
      - description: End date in YYYY-MM-DD format
        example: "2025-11-30"
        in: query
        name: end_date
        type: string
      - default: expense
        description: 'Transaction type: income or expense'
        enum:
        - income
        - expense
        in: query
        name: type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Spending analysis report
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.SpendingByCategoryResponse'
              type: object
        "400":
          description: Invalid query parameters
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized - invalid or missing JWT token
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Spending by category report
      tags:
      - Reports
  /transactions:
    get:
      description: Get paginated list of transactions for the authenticated user's
        family with optional filters
      parameters:
      - description: 'Filter by type: income or expense'
        enum:
        - income
        - expense
        in: query
        name: type
        type: string
      - description: Filter by account ID (UUID)
        format: uuid
        in: query
        name: account_id
        type: string
      - description: Filter by month in YYYY-MM format
        example: 2025-12
        in: query
        name: month
        type: string
      - default: 1
        description: Page number (starts from 1)
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 50
        description: Items per page
        in: query
        maximum: 100
        minimum: 1
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Paginated list of transactions
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.TransactionListResponse'
              type: object
        "400":
          description: Invalid query parameters
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized - invalid or missing JWT token
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List transactions
      tags:
      - Transactions
    post:
      consumes:
      - application/json
      description: Create a new income or expense transaction with automatic currency
        conversion to base currency (RSD)
      parameters:
      - description: Transaction creation data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateTransactionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Transaction created successfully
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.TransactionResponse'
              type: object
        "400":
          description: Invalid request body, validation error, or business rule violation
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized - invalid or missing JWT token
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create transaction
      tags:
      - Transactions
  /transactions/{id}:
    delete:
      description: Soft delete a transaction (marks as inactive, account balance is
        automatically recalculated)
      parameters:
      - description: Transaction ID (UUID)
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
