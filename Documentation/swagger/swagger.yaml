            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Transaction not found or does not belong to user's family
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update transaction
      tags:
      - Transactions
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
tags:
- description: User authentication and authorization
  name: Authentication
- description: Financial accounts management
  name: Accounts
- description: Transaction categories management
  name: Categories
- description: Income and expense transactions
  name: Transactions
- description: Financial reports and analytics
  name: Reports
- description: Currency exchange rates and conversion
  name: Currencies
