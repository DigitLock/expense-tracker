            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Transaction not found or does not belong to user's family
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete transaction
      tags:
      - Transactions
    get:
